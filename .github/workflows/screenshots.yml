name: Screenshots

# Renders pull request screenshots from a harness test on throwaway screenshots/* branches,
# and uploads them as the "screenshots" artifact.
on:
  push:
    branches:
      - 'screenshots/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Screenshots:
    # The image the CI workflow uses.
    runs-on: xcode-27
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setting up Xcode
        run: sudo xcode-select -s "/Applications/Xcode_27.2.app"

      - name: Render screenshots
        shell: bash
        env:
          # xcodebuild passes TEST_RUNNER_-prefixed variables to the test process without the prefix.
          TEST_RUNNER_SCREENSHOTS_DIR: ${{ github.workspace }}/screenshots
        run: |
          mkdir -p "$TEST_RUNNER_SCREENSHOTS_DIR"
          set -o pipefail
          env -u QURAN_SYNC xcrun xcodebuild test \
            -scheme QuranEngine-Package \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=iPhone 17e,OS=latest" \
            -derivedDataPath .build/DerivedData/no-sync \
            -only-testing:QuranTranslationFeatureTests/TranslationVerseReferencesScreenshotTests \
            2>&1 | tee xcodebuild.log | grep --line-buffered -E "error:|\[screenshots\]|^Test Case|^Test Suite|^\*\* "
          ls -la "$TEST_RUNNER_SCREENSHOTS_DIR"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: screenshots
          path: screenshots/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: xcodebuild-log
          path: xcodebuild.log
